# Cloudflare Workers con Static Assets: el sitio es estático (dist/) y Cloudflare lo sirve desde su red.
# Build: `npm run build:cloudflare` · Deploy: `npx wrangler deploy`. Ver README_DEPLOY.md.
name = "inmutalkey-web"
compatibility_date = "2026-09-15"

[assets]
directory = "./dist"
# Las páginas se generan como archivo (verificar.html) y se sirven sin diagonal final: /verificar.
html_handling = "drop-trailing-slash"
# Rutas inexistentes → dist/404.html con estado 404.
not_found_handling = "404-page"

# Fase C (formularios y reseñas): se agregará aquí el Worker de /api/* (`main` + `run_worker_first`)
# y la base D1. No se declara antes: un Worker no se despliega con una base que todavía no existe.
#
# main = "src/worker/index.ts"
# [assets] … run_worker_first = ["/api/*"]
# [[d1_databases]]
# binding = "DB"
# database_name = "inmutalkey-web"
# database_id = "<id que imprime `npx wrangler d1 create inmutalkey-web`>"
# migrations_dir = "migrations"
